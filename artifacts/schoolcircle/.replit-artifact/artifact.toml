kind = "web"
previewPath = "/"
title = "SchoolCircle"
description = "SchoolCircle on its original Next.js framework, with the twelve-repository integration."
version = "1.0.0"
id = "artifacts/schoolcircle"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 24405

[services.development]
run = "pnpm -w run dev"

[services.production]
build = ["pnpm", "-w", "run", "build"]
run = ["pnpm", "-w", "run", "start"]

[services.env]
PORT = "24405"
BASE_PATH = "/"