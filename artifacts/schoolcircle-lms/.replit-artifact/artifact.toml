kind = "web"
previewPath = "/"
title = "SchoolCircle LMS"
description = "A course planning and learning workspace for instructors and students, with a live planning board and interactive prototype flows."
version = "1.0.0"
id = "artifacts/schoolcircle-lms"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24748

[services.development]
run = "pnpm --filter @workspace/schoolcircle-lms run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/schoolcircle-lms", "run", "build" ]
serve = "static"
publicDir = "artifacts/schoolcircle-lms/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24748"
BASE_PATH = "/"
