# Local Postgres for development or offline hardware (Docker is not used in Replit).
# Cloud uses Cloud SQL Postgres with the same schema. See docs/CLOUD_POSTGRES.md.
services:
  db:
    image: postgres:16-alpine
    container_name: schoolcircle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: schoolcircle
      POSTGRES_PASSWORD: schoolcircle
      POSTGRES_DB: schoolcircle_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - schoolcircle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolcircle -d schoolcircle_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  schoolcircle_pgdata:
