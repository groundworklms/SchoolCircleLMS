# Firebase App Hosting runtime config.
# https://firebase.google.com/docs/app-hosting/configure
# Database: see the DATABASE_URL block at the bottom and docs/CLOUD_POSTGRES.md.
# Do not run migrations or demo seeding in the build/start commands.
runConfig:
  # db-f1-micro allows ~25 Postgres connections; each instance pools connection_limit=3.
  maxInstances: 4

  # Keep one instance warm. Without this App Hosting scales to zero, and with a
  # handful of occasional testers that means nearly every session's first click
  # pays a full cold start: container boot, Next.js server start, Prisma client
  # init and the Cloud SQL connector handshake. That is seconds of latency on a
  # click that should be instant, and no amount of query tuning removes it.
  #
  # The cost is one always-running instance. Set this back to 0 if the demo goes
  # idle for long stretches and the wait is acceptable.
  minInstances: 1

  # Next.js plus Prisma, firebase-admin and the Cloud SQL connector is a lot to
  # hold in the 512 MiB default; paging under memory pressure shows up as slow
  # requests rather than as an error.
  memoryMiB: 1024
  cpu: 1

  # There is NO request-timeout setting to put here, and this note exists so the
  # next person does not spend an afternoon looking for one. runConfig supports
  # exactly five keys -- cpu, memoryMiB, concurrency, maxInstances, minInstances
  # -- per the App Hosting docs, the App Hosting REST schema, and the RunConfig
  # interface in firebase-tools. The Cloud Run request timeout this service
  # actually runs under is the platform default of 300s, which is what cuts the
  # course-generation progress stream partway through a long course. See the
  # long comment in app/api/learning/courses/draft/stream/route.js for what that
  # does and does not cost, and for the one (untested) operator lever.
env:
  # --- Grounding: point the cloud app's server-side /api/doctrine at the Orin's
  # Anchor engine, exposed over a tunnel.
  # NOTE: this is a TEMPORARY Cloudflare quick-tunnel URL — it changes whenever the
  # tunnel restarts. For a stable setup use a named Cloudflare tunnel. Update if restarted.
  - variable: DOCTRINE_BASE_URL
    value: https://maryland-naples-repeat-campbell.trycloudflare.com
    availability:
      - RUNTIME
  - variable: DOCTRINE_TIMEOUT_MS
    value: "30000"
    availability:
      - RUNTIME

  # --- Firebase Authentication (login). PUBLIC client config, inlined into the
  # browser bundle at build time -> must be available at BUILD (and RUNTIME).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDNULW649liOlpJEuIfKc5fGrsAjmrOF1g
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: schoolcircle-ae29a.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: schoolcircle-ae29a
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: schoolcircle-ae29a.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "770710930289"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:770710930289:web:cda5d4e9c6ea74742cecd0"
    availability:
      - BUILD
      - RUNTIME

  # --- Sign-in allowlist: OFF. Anyone with a Firebase account may sign in and
  # create an account. (During the event this pinned sign-in to the team; the
  # list is kept below in case it needs to come back.)
  #
  # Opening sign-in has a consequence for the generation provider: with the
  # allowlist off, "instructor" is a self-declared role, so choosing the
  # generation MODEL requires the operator passphrase, not just the role
  # (app/api/learning/model-settings/route.js). Otherwise anyone who signed up
  # could point generation at a $180/M-token model on the key below.
  #
  # To restrict sign-in again: comma-separated, case-insensitive emails. Baked
  # into the client at BUILD time, so editing the list needs a new rollout.
  # - variable: NEXT_PUBLIC_ALLOWED_EMAILS
  #   value: 189409964+tewhite4@users.noreply.github.com,121060100+canester67@users.noreply.github.com,328472012+N0t-A-User@users.noreply.github.com,195714926+jeranaias@users.noreply.github.com
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # --- In-app "Report an issue" widget -> files GitHub issues directly via
  # /api/feedback. Secrets live in Cloud Secret Manager; the App Hosting compute
  # service account has Secret Accessor on both.
  - variable: GITHUB_FEEDBACK_REPO
    value: groundworklms/SchoolCircleLMS
    availability:
      - RUNTIME
  # Fine-grained PAT (schoolcircle-feedback-widget): Issues read/write on the repo above.
  - variable: GITHUB_FEEDBACK_TOKEN
    secret: GITHUB_FEEDBACK_TOKEN
    availability:
      - RUNTIME
  # Shared team passphrase testers enter once in the widget.
  - variable: FEEDBACK_KEY
    secret: FEEDBACK_KEY
    availability:
      - RUNTIME

  # --- Generation provider: OpenRouter, on a personal key (post-event).
  # The event's OPENAI_API_KEY was revoked when the event ended. Generation now
  # runs through OpenRouter on a personally funded key, so the model default
  # below is chosen for cost. The MODEL can still be changed at runtime in
  # Settings -> Generation model (docs/generation-provider.md); the endpoint and
  # key cannot be changed from the UI without the operator passphrase.
  #
  # OPENROUTER_API_KEY is the only credential the transport accepts for this
  # endpoint (lib/providers.js): a generic MODEL_API_KEY never follows an
  # OpenRouter selection and an OpenRouter key never follows any other endpoint.
  #   gcloud secrets create OPENROUTER_API_KEY --data-file=-
  #   (then grant the App Hosting compute service account Secret Accessor on it)
  #
  # COST BACKSTOP: set a credit limit on the key itself at
  # https://openrouter.ai/settings/keys. That is the one control that holds no
  # matter what this app does; everything in-app is about spending less, not
  # about capping spend.
  - variable: OPENROUTER_API_KEY
    secret: OPENROUTER_API_KEY
    availability:
      - RUNTIME

  - variable: MODEL_BASE_URL
    value: https://openrouter.ai/api/v1
    availability:
      - RUNTIME

  # The deployment default: Gemini 3.1 Flash Lite is about 8x cheaper than the
  # Gemini 3.1 Pro the OpenRouter overlay originally named ($0.25 / $1.50 vs
  # $2 / $12 per 1M tokens in / out, per the OpenRouter catalogue on
  # 2026-09-21), supports strict structured output, and the transport already
  # asks the Gemini family for low, excluded reasoning so the thinking budget
  # does not bill as output. Prices are shown in the Settings picker for
  # anything else; the operator passphrase is required to switch.
  - variable: MODEL_ID
    value: google/gemini-3.1-flash-lite
    availability:
      - RUNTIME

  # NOTE: a model selection stored in Settings -> Generation model WINS over the
  # two values above. After this rollout, open that panel and either "Stop using
  # these settings" or re-save with the OpenRouter endpoint: a stored row still
  # pointing at api.openai.com reports "needs an API key" (503) rather than
  # silently using the OpenRouter key against OpenAI, so generation stays down
  # until that is done.

  # Optional. SETTINGS_ENCRYPTION_KEY is only needed to TYPE an API key into
  # Settings; with the key supplied above it is unnecessary. MODEL_SETTINGS_KEY
  # pins the operator passphrase from configuration instead of letting the first
  # instructor claim one in the panel.
  #   gcloud secrets create SETTINGS_ENCRYPTION_KEY --data-file=- <<< "$(openssl rand -base64 32)"
  #   gcloud secrets create MODEL_SETTINGS_KEY --data-file=-
  # - variable: SETTINGS_ENCRYPTION_KEY
  #   secret: SETTINGS_ENCRYPTION_KEY
  #   availability:
  #     - RUNTIME
  # - variable: MODEL_SETTINGS_KEY
  #   secret: MODEL_SETTINGS_KEY
  #   availability:
  #     - RUNTIME

  # --- Database: Cloud SQL Postgres (the Firebase Data Connect trial instance), reached
  # through the Cloud SQL connector in lib/db.js -- the compute service account has
  # roles/cloudsql.client. DATABASE_URL (Secret Manager) carries user/password/database;
  # its host is ignored while CLOUD_SQL_CONNECTION_NAME is set. Migrations/seeds run from
  # an operator laptop via `npm run db:proxy`, never from build/start.
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME
  - variable: CLOUD_SQL_CONNECTION_NAME
    value: schoolcircle-ae29a:us-east4:schoolcircle-ae29a-instance
    availability:
      - RUNTIME
  - variable: SCHOOLCIRCLE_DB_ENV
    value: demo
    availability:
      - RUNTIME
