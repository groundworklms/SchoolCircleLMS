name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Prisma needs a parseable URL at generate/build time. Nothing connects.
      # The Postgres-fixture tests skip themselves when no reachable DB is set,
      # so this placeholder is removed again before `pnpm test` below.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Native Next + archived API contract tests, then the shared arsenal
      # adapter/evidence tests (no database).
      - name: Test
        run: |
          unset DATABASE_URL
          pnpm test
          pnpm run test:upstream-learning

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Locate native PostgreSQL
        run: |
          PG_BIN="$(pg_config --bindir)"
          test -x "$PG_BIN/initdb"
          echo "$PG_BIN" >> "$GITHUB_PATH"
      - name: Seed safety policy
        run: pnpm run test:db-policy
      - name: Isolated PostgreSQL persistence
        run: pnpm run test:db
