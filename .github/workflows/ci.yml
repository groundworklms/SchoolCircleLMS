name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Prisma needs a parseable URL at generate/build time. Nothing connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Arsenal adapter + evidence contract tests (no database; RUN_DB_TESTS is unset).
      # `npm test` is the de-duplicated pass: every file named by test:navigation is
      # already in this list, which is why there is no separate test:navigation step.
      # test/scorm-verification.test.mjs skips its two mode-0700 cases off-POSIX and
      # runs them for real here on ubuntu -- see the skip reason in that file.
      # scripts/scorm/runtime-harness.test.mjs is here too: it had no script at all
      # and so had never gated a merge.
      - name: Test
        run: npm test

      - name: Account profile and session regressions
        run: npm run test:account-profile

      - name: Non-empty learning views
        run: npm run test:ui-rendering

      - name: Manual course authoring contracts
        run: npm run test:authoring

      # The AI authoring path is the only authoring path (#78), so its revision,
      # immutable-release and learner-redaction contracts gate merges like the
      # rest. Needs --experimental-test-module-mocks; the script carries the flag.
      - name: AI course authoring, releases and redaction
        run: npm run test:ai-authoring

      # Transport contract for the text model: a key alone never selects a cloud
      # provider, and prose seams must not inherit the JSON response format.
      - name: Text model transport
        run: npm run test:model

      # The doctrine endpoint is runtime-configurable because the Orin moves
      # between laptops. These guard the precedence (a stored address beats
      # DOCTRINE_BASE_URL) and that an unreachable settings store degrades to
      # the environment instead of taking grounding down.
      - name: Doctrine endpoint configuration
        run: npm run test:doctrine

      # The doctrine client must attach a Firebase ID token and must never fetch
      # without a session. The script has existed since the seam landed but no job
      # ran it, so it had never gated a merge. Needs --experimental-test-module-mocks;
      # the script carries the flag.
      - name: Doctrine client authorization
        run: npm run test:doctrine-auth

      # Renaming and removing library records. The delete guards decide whether
      # learner attempts survive, so they gate merges.
      - name: Library record rename and delete guards
        run: npm run test:record-admin

      - name: Grounded student chat contracts
        run: npm run test:student-grounding

      # Source library: ownership, PDF originals, collections, and batch
      # approval, which must apply the single-source gate per id.
      - name: Source library contracts
        run: npm run test:source-library

      # Roster and in-app messaging. These are the delivery-authorization contracts:
      # a message is bound to a User row rather than a token email claim, a
      # recipient needs real participation in the course, a learner can only touch
      # their own mailbox, and sending is rate limited.
      - name: Class roster and messaging
        run: npm run test:roster

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Locate native PostgreSQL
        run: |
          PG_BIN="$(pg_config --bindir)"
          test -x "$PG_BIN/initdb"
          echo "$PG_BIN" >> "$GITHUB_PATH"
      - name: Seed safety policy
        run: npm run test:db-policy
      # Fails when schema.prisma has changes that no committed migration produces,
      # i.e. someone edited the schema and forgot `prisma migrate dev`. The live DB
      # is migrated from prisma/migrations/ (see migrate.yml), so schema-only
      # changes never reach it and break the first query that touches them (#69).
      - name: Migrations produce schema.prisma
        env:
          PGDATA: ${{ runner.temp }}/pg-shadow
        run: |
          initdb -D "$PGDATA" -U ci --auth=trust > /dev/null
          pg_ctl -D "$PGDATA" -o "-p 5499 -k /tmp" -w start > /dev/null
          createdb -h localhost -p 5499 -U ci shadow
          npx prisma migrate diff             --from-migrations prisma/migrations             --shadow-database-url postgresql://ci@localhost:5499/shadow             --to-schema-datamodel prisma/schema.prisma             --exit-code             || { echo "::error::prisma/schema.prisma differs from what prisma/migrations/ produces. Generate a migration (npm run db:migrate) and commit it."; exit 1; }
          pg_ctl -D "$PGDATA" -w stop > /dev/null
      - name: Isolated PostgreSQL persistence
        run: npm run test:db
      - name: Manual publication and learner persistence
        run: npm run test:authoring-db
      - name: Roster persistence
        run: npm run test:roster-db

      # Deliberately NOT wired as steps yet -- do not add them without evidence:
      #
      #   npm run test:cohort-privacy-db  (test/cohort-privacy-postgres.mjs)
      #     Needs initdb/pg_ctl AND a Linux Prisma query engine. It could not be
      #     executed on the Windows dev machine (no PostgreSQL server) and could not
      #     be executed in a Linux container (the checked-out node_modules carries
      #     Windows Prisma engines), so nobody has seen it pass or fail. Run it once
      #     on Linux and wire it here if it is green.
      #
      #   npm run test:offline-auth
      #     Its three files land with the offline-auth seam (PR #139). The script is
      #     defined so it is ready, but `node --test` exits 1 when every named path is
      #     missing, so it must stay out of CI and out of `npm test` until those files
      #     are on main.
      #
      #   npm run test:offline-verify  (scripts/offline/verify.test.mjs)
      #     Green on Node 20 Linux and on ~25 local runs, but it asserts stalled- and
      #     oversized-response behaviour against loopback HTTP servers with real
      #     timers, and it failed once on a machine that was out of resources at that
      #     moment. Timing-sensitive by construction, so it is kept out of the shared
      #     gate rather than risk an intermittent red for every branch.
