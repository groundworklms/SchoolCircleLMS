name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Prisma needs a parseable URL at generate/build time. Nothing connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Arsenal adapter + evidence contract tests (no database; RUN_DB_TESTS is unset).
      - name: Test
        run: npm test

      - name: Account profile and session regressions
        run: npm run test:account-profile

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Locate native PostgreSQL
        run: |
          PG_BIN="$(pg_config --bindir)"
          test -x "$PG_BIN/initdb"
          echo "$PG_BIN" >> "$GITHUB_PATH"
      - name: Seed safety policy
        run: npm run test:db-policy
      - name: Isolated PostgreSQL persistence
        run: npm run test:db
